<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان شامل على الوحدة الأولى والثانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --primary:#5b3ea6;
    --primary-dark:#402b78;
    --accent:#1098ad;
    --bg:#f2eefb;
    --card:#ffffff;
    --correct:#2f9e44;
    --wrong:#e03131;
    --border:#e1d9f5;
    --text:#1f2937;
    --muted:#64748b;
    --pdf:#e8590c;
    --pdf-dark:#c94a08;
    --fill:#845ef7;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:auto;overflow-x:hidden;width:100%;}
  body{
    margin:0;
    overflow-x:hidden;
    position:relative;
    font-family:'Tajawal','Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
  }
  .container{max-width:800px;margin:0 auto;}
  .header{
    background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;
    padding:24px 28px;
    border-radius:16px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 6px 18px rgba(91,62,166,0.28);
  }
  .header h1{margin:0;font-size:1.15rem;font-weight:700;line-height:1.5;}
  .header p{margin:6px 0 0;font-size:0.86rem;opacity:0.95;}
  #timer{
    background:rgba(255,255,255,0.2);
    padding:10px 20px;
    border-radius:12px;
    font-size:1.4rem;
    font-weight:900;
    min-width:110px;
    text-align:center;
    letter-spacing:1px;
  }
  #timer.warn{background:#e03131;}
  .progress-wrap{background:#e3daf7;border-radius:8px;height:10px;margin-bottom:8px;overflow:hidden;}
  #progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width 0.3s;}
  .progress-label{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:18px;font-weight:700;}
  .card{
    background:var(--card);
    border-radius:16px;
    padding:24px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(30,41,59,0.07);
    border:1px solid var(--border);
  }
  .q-number{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    padding:0 12px;
    height:32px;
    border-radius:16px;
    text-align:center;
    line-height:32px;
    font-size:0.9rem;
    font-weight:700;
    margin-left:10px;
  }
  .q-type-badge{
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:0.78rem;
    font-weight:700;
    margin-right:6px;
  }
  .badge-mcq{background:#e7f1ff;color:#2b6cb0;}
  .badge-tf{background:#e6fcf5;color:#0b7285;}
  .badge-essay{background:#fff4e6;color:#d9480f;}
  .q-lesson{font-size:0.78rem;color:var(--muted);font-weight:700;margin-top:4px;}
  .q-text{font-size:1.1rem;font-weight:700;margin:16px 0 20px;line-height:1.8;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border:2px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    transition:all 0.15s;
    font-size:1rem;
  }
  .option:hover{border-color:var(--primary);background:#f7f3ff;}
  .option.selected{border-color:var(--primary);background:#f0e9ff;font-weight:700;}
  .option input{accent-color:var(--primary);}
  textarea.essay-input{
    width:100%;
    min-height:150px;
    padding:14px 16px;
    border:2px solid var(--border);
    border-radius:12px;
    font-family:inherit;
    font-size:1rem;
    resize:vertical;
    line-height:1.7;
  }
  textarea.essay-input:focus{outline:none;border-color:var(--primary);}
  .essay-note{color:var(--muted);font-size:0.85rem;margin-top:8px;}
  .nav-bar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
  }
  button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:14px 34px;
    font-size:1.02rem;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition:all 0.15s;
    font-family:inherit;
  }
  button:hover{background:var(--primary-dark);transform:translateY(-1px);}
  button:disabled{background:#94a3b8;cursor:not-allowed;transform:none;}
  .btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary);padding:12px 32px;}
  .btn-secondary:hover{background:#f7f3ff;}
  .btn-finish{background:var(--correct);}
  .btn-finish:hover{background:#2b8a3e;}
  #results{display:none;}
  .score-card{
    text-align:center;
    background:var(--card);
    border-radius:16px;
    padding:32px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(30,41,59,0.07);
  }
  .score-num{font-size:3.2rem;font-weight:900;color:var(--primary);}
  .score-msg{font-size:1.05rem;color:var(--muted);margin-top:8px;font-weight:500;line-height:1.9;}
  .review-item{border-right:5px solid var(--correct);}
  .review-item.wrong{border-right:5px solid var(--wrong);}
  .review-item.essay{border-right:5px solid var(--pdf);}
  .answer-line{padding:11px 14px;border-radius:10px;margin-top:6px;font-size:0.95rem;}
  .answer-line.correct{background:#ebfbee;color:var(--correct);font-weight:700;}
  .answer-line.wrong{background:#fff5f5;color:var(--wrong);font-weight:700;}
  .answer-line.essay{background:#fff8ef;color:#8a4b08;font-weight:500;white-space:pre-wrap;line-height:1.8;}
  #not-answered-warning{color:var(--wrong);text-align:center;margin-bottom:10px;font-size:0.9rem;display:none;font-weight:700;}
  .unanswered{border-color:#f59f00 !important;}
  #start-screen{
    background:var(--card);
    border-radius:16px;
    padding:36px 30px;
    text-align:center;
    box-shadow:0 3px 14px rgba(30,41,59,0.08);
  }
  #start-screen h2{margin-top:0;font-size:1.3rem;}
  #start-screen p{color:var(--muted);}
  #start-screen input{
    width:100%;
    max-width:320px;
    padding:15px 16px;
    font-size:1.05rem;
    border:2px solid var(--border);
    border-radius:12px;
    margin:16px 0;
    text-align:center;
    font-family:inherit;
  }
  #start-screen input:focus{outline:none;border-color:var(--primary);}
  #name-warning{color:var(--wrong);font-size:0.9rem;display:none;margin-bottom:10px;font-weight:700;}
  .exam-info{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin:18px 0;
    font-size:0.88rem;
    color:var(--muted);
  }
  .exam-info span{background:#f1eefc;padding:6px 14px;border-radius:20px;font-weight:700;}
  .action-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .pdf-btn{background:var(--pdf);}
  .pdf-btn:hover{background:var(--pdf-dark);}
  .wa-btn{background:#25D366;}
  .wa-btn:hover{background:#1ea952;}
  #send-status{margin-top:14px;font-size:0.9rem;color:var(--muted);font-weight:700;min-height:20px;}
  #pdf-report{position:fixed;left:0;top:0;width:750px;background:#fff;padding:30px;transform:translateX(-100%) translateX(-50px);pointer-events:none;z-index:-1;}

  html, body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    color-scheme:light;
  }

  @media (max-width: 600px){
    body{padding:10px;background:#f2eefb;}
    .container{width:100%;max-width:100%;}
    .header{padding:16px 14px;border-radius:12px;flex-direction:column-reverse;align-items:stretch;text-align:right;gap:10px;}
    .header h1{font-size:1rem;line-height:1.65;}
    .header p{font-size:0.76rem;line-height:1.6;}
    #timer{align-self:center;min-width:100px;width:auto;padding:8px 16px;font-size:1.2rem;}
    .card{padding:16px 12px;border-radius:12px;}
    #start-screen{padding:24px 14px;border-radius:12px;}
    #start-screen input{max-width:none;width:100%;}
    .exam-info{gap:8px;font-size:0.78rem;}
    .exam-info span{padding:6px 10px;max-width:100%;}
    .q-text{font-size:1rem;line-height:1.85;overflow-wrap:anywhere;}
    .option{padding:12px 10px;font-size:0.94rem;line-height:1.65;align-items:flex-start;overflow-wrap:anywhere;}
    .option input{flex:0 0 auto;margin-top:4px;}
    .q-number{margin-left:6px;padding:0 9px;height:30px;line-height:30px;font-size:0.82rem;}
    .q-type-badge{padding:4px 8px;font-size:0.7rem;margin-right:0;}
    textarea.essay-input{min-height:180px;font-size:16px;}
    .nav-bar{gap:8px;}
    .nav-bar button, #start-btn{flex:1;min-width:0;padding:12px 10px;font-size:0.92rem;}
    .score-card{padding:22px 12px;}
    .score-num{font-size:2.5rem;}
    .action-buttons{flex-direction:column;}
    .action-buttons button{width:100%;padding:12px 10px;font-size:0.9rem;}
    #pdf-report{width:750px;}
  }

  .sec-hdr{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:14px;padding:14px 18px;margin:22px 0 12px;font-weight:900;font-size:1.05rem;line-height:1.7;}
  .sub-hdr{background:#efe9fb;color:var(--primary-dark);border-radius:12px;padding:10px 16px;margin:16px 0 10px;font-weight:700;border-right:5px solid var(--primary);line-height:1.7;}
  .mk{display:inline-block;background:#fff4e6;color:#d9480f;border-radius:14px;padding:2px 10px;font-size:0.76rem;font-weight:700;margin-right:6px;}
  .answer-line.model{background:#eef6ff;color:#1c4f8a;font-weight:500;white-space:pre-wrap;line-height:1.8;}
  #timer-float{position:fixed;top:10px;left:10px;z-index:99;background:var(--primary);color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:1rem;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none;direction:ltr;}
  #timer-float.warn{background:#e03131;}
  textarea.essay-input{min-height:110px;}
  textarea.short-input{min-height:70px;}
  .submit-box{text-align:center;margin:24px 0 40px;}
  .rules{text-align:right;background:#f7f3ff;border-radius:12px;padding:12px 18px;line-height:2;font-size:.92rem;color:var(--text);}
</style>
</head>
<body>
<div id="timer-float">120:00</div>
<div class="container">
  <div class="header">
    <div id="timer">120:00</div>
    <div>
      <p style="margin:0 0 4px;font-size:0.85rem;font-weight:700;opacity:0.9;direction:ltr;text-align:right;">Prepared by Eng.Marco Edwer</p>
      <h1>امتحان شامل على الوحدة الأولى والثانية</h1>
    </div>
  </div>
  <div id="start-screen">
    <h2>بيانات الطالب</h2>
    <p>يرجى كتابة الاسم قبل بدء الامتحان</p>
    <div id="name-warning">يرجى كتابة الاسم أولاً</div>
    <input type="text" id="student-name" placeholder="الاسم">
    <div class="exam-info">
      <span>⏱ المدة: ساعتان (120 دقيقة)</span>
      <span>💯 الدرجة الكلية: 100</span>
      <span>🔘 الجزء الأول: 50 درجة (موضوعي)</span>
      <span>✍️ الجزء الثاني: 50 درجة (مقالي)</span>
    </div>
    <br>
    <button id="start-btn">ابدأ الامتحان</button>
  </div>
  <div class="progress-wrap" style="display:none;"><div id="progress-bar"></div></div>
  <div class="progress-label" id="progress-label" style="display:none;"></div>
  <div id="quiz-area"></div>
  <div class="submit-box" id="submit-box" style="display:none;">
    <div id="not-answered-warning" style="display:none;"></div>
    <button class="btn-finish" id="submit-btn">إنهاء وتسليم الامتحان ✔</button>
  </div>
  <div class="results" id="results">
    <div id="report-content">
      <div class="score-card" style="padding:24px;">
        <div id="score-emoji" style="font-size:3rem;line-height:1;margin-bottom:6px;"></div>
        <div class="score-num" id="score-num"></div>
        <div class="score-msg" id="score-msg"></div>
        <div class="action-buttons">
          <button class="wa-btn" id="send-wa-btn">📱 إرسال التقرير PDF على واتساب</button>
        </div>
        <div id="send-status"></div>
      </div>
      <div id="review-area"></div>
    </div>
  </div>
</div>
<div id="pdf-report"></div>
<script>
window.scrollTo(0,0);
const TEACHER_PHONE = "201006723835"; // رقم واتساب المستر
const EXAM_TITLE = "امتحان شامل على الوحدة الأولى والثانية";
const LESSONS = {"1-1": "الدرس 1-1: تطور تكنولوجيا المعلومات والتحول الاجتماعي", "1-2": "الدرس 1-2: كيف يعمل الذكاء الاصطناعي", "1-3": "الدرس 1-3: الذكاء الاصطناعي في الحياة اليومية والصناعة", "1-4": "الدرس 1-4: القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي", "2-1": "الدرس 2-1: تقنيات التشفير والمصادقة", "2-2": "الدرس 2-2: تصميم أمان الشبكات", "2-3": "الدرس 2-3: الاستجابة للحوادث وإدارة المخاطر"};

const KIND = {term:"اكتب المصطلح",fill:"أكمل",compare:"قارن",why:"علّل",apply:"طبّق",exam:"سؤال على نمط الامتحان"};

function typeBadge(item){
  if(item.type==="mcq") return '<span class="q-type-badge badge-mcq">اختر</span>';
  if(item.type==="tf") return '<span class="q-type-badge badge-tf">صح أم خطأ</span>';
  return '<span class="q-type-badge badge-essay">'+KIND[item.kind]+'</span><span class="mk">'+item.marks+' درجة</span>';
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function renderAll(){
  const area=document.getElementById('quiz-area'); area.innerHTML='';
  questions.forEach((item,idx)=>{
    if(item.first){
      if(item.part){ const h=document.createElement('div'); h.className='sec-hdr'; h.textContent=item.part; area.appendChild(h); }
      const s=document.createElement('div'); s.className='sub-hdr'; s.textContent=item.title; area.appendChild(s);
    }
    const card=document.createElement('div'); card.className='card'; card.id='card-'+idx;
    let body='';
    if(item.type==='mcq'){
      body='<div class="options">'+item.options.map((o,i)=>`<label class="option" data-o="${i}"><input type="radio" name="q${idx}"><span>${esc(o)}</span></label>`).join('')+'</div>';
    } else if(item.type==='tf'){
      body='<div class="options"><label class="option" data-o="true"><input type="radio" name="q'+idx+'"><span>✔️ صح</span></label><label class="option" data-o="false"><input type="radio" name="q'+idx+'"><span>❌ خطأ</span></label></div>';
    } else {
      body=`<textarea class="essay-input ${item.short?'short-input':''}" id="essay-${idx}" placeholder="اكتب إجابتك هنا..."></textarea>`;
    }
    card.innerHTML=`<div>${typeBadge(item)}<span class="q-number">${item.no}</span></div><div class="q-text">${esc(item.q).replace(/\n/g,'<br>')}</div>${body}`;
    area.appendChild(card);
    if(item.type==='essay'){
      card.querySelector('textarea').addEventListener('input',function(){userAnswers[idx]=this.value;updateProgress();});
    } else {
      card.querySelectorAll('.option').forEach(opt=>opt.addEventListener('click',function(){
        const v=this.dataset.o; userAnswers[idx]=item.type==='tf'?(v==='true'):parseInt(v);
        card.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
        this.classList.add('selected'); this.querySelector('input').checked=true;
        card.classList.remove('unanswered'); updateProgress();
      }));
    }
  });
  updateProgress();
}
function isAnswered(i){const a=userAnswers[i];return questions[i].type==='essay'?(a&&a.trim()!==''):(a!==null&&a!==undefined);}
function updateProgress(){
  let n=0; questions.forEach((_,i)=>{if(isAnswered(i))n++;});
  document.getElementById('progress-bar').style.width=(n/questions.length*100)+'%';
  document.getElementById('progress-label').textContent=`تمت الإجابة عن ${n} من ${questions.length} سؤالًا`;
}

let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
}
function playTick(freq, duration){
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m + ':' + s;
}


function startTimer(){
  const el=document.getElementById('timer'), fl=document.getElementById('timer-float');
  examStartTimestamp=Date.now();
  function tick(){
    if(submitted) return;
    timeLeft=Math.max(0,TOTAL_TIME-Math.floor((Date.now()-examStartTimestamp)/1000));
    el.textContent=fl.textContent=formatTime(timeLeft);
    if(timeLeft<=300){el.classList.add('warn');fl.classList.add('warn');}
    if(timeLeft<=60&&timeLeft>0) playTick(500+(60-timeLeft)*10,timeLeft<=10?0.18:0.1);
    if(timeLeft<=0){clearInterval(timerInterval);finishExam(true);}
  }
  tick(); timerInterval=setInterval(tick,1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!submitted)tick();});
}

let finalA=0, finalAMax=0, wrongQuestionNumbers=[], examDurationText='', essayAnswersList=[];
function finishExam(auto){
  if(submitted) return; submitted=true; clearInterval(timerInterval);
  const elapsed=Math.min(TOTAL_TIME,Math.floor((Date.now()-examStartTimestamp)/1000));
  examDurationText=formatTime(elapsed);
  const rv=document.getElementById('review-area'); rv.innerHTML='';
  let score=0,max=0,wMax=0; wrongQuestionNumbers=[]; essayAnswersList=[];
  questions.forEach((item,idx)=>{
    const a=userAnswers[idx], div=document.createElement('div'), label=`سؤال ${item.no}`;
    const head=`<div>${typeBadge(item)}<span class="q-number">${label}</span></div><div class="q-lesson">${LESSONS[item.lesson]}</div><div class="q-text">${esc(item.q).replace(/\n/g,'<br>')}</div>`;
    if(item.type==='essay'){
      wMax+=item.marks; div.className='card review-item essay';
      const txt=(a&&a.trim()!=='')?a:'لم تتم الإجابة';
      essayAnswersList.push({num:label,q:item.q,a:txt,model:item.model,marks:item.marks});
      div.innerHTML=head+`<div class="answer-line essay">إجابة الطالب: ${esc(txt)}</div><div class="answer-line model">نموذج الإجابة (${item.marks} درجة):\n${esc(item.model)}</div>`;
    } else {
      max++; const ok=a===item.correct; if(ok)score++; else wrongQuestionNumbers.push(label);
      const fmt=v=>item.type==='mcq'?(v===null?'لم تتم الإجابة':item.options[v]):(v===null?'لم تتم الإجابة':(v?'صح':'خطأ'));
      const corr=item.type==='mcq'?item.options[item.correct]:(item.correct?'صح':'خطأ');
      div.className='card review-item'+(ok?'':' wrong');
      div.innerHTML=head+(ok?`<div class="answer-line correct">الإجابة: ${esc(fmt(a))} ✓</div>`:`<div class="answer-line wrong">إجابة الطالب: ${esc(fmt(a))} ✗</div><div class="answer-line correct">الإجابة الصحيحة: ${esc(corr)}</div>`);
    }
    rv.appendChild(div);
  });
  finalA=score; finalAMax=max;
  const pct=Math.round(score/max*100);
  document.getElementById('score-num').textContent=`الجزء الأول: ${score} / ${max}`;
  let msg,em; if(pct>=90){msg='ممتاز! أداء رائع';em='🏆';} else if(pct>=75){msg='جيد جدًا';em='😄';} else if(pct>=50){msg='جيد، يحتاج إلى مزيد من المراجعة';em='🙂';} else {msg='يُنصح بمراجعة الدروس من البداية';em='😕';}
  document.getElementById('score-emoji').textContent=em;
  document.getElementById('score-msg').innerHTML=`الاسم: <strong>${esc(studentName)}</strong><br>التاريخ: ${new Date().toLocaleDateString('ar-EG')}<br>الوقت المستغرق: <strong>${examDurationText}</strong> من أصل 120:00<br>الجزء الأول (موضوعي): ${pct}% — ${msg}<br>الجزء الثاني (مقالي): من ${wMax} درجة — يُصحَّح يدويًا بمقارنة إجابتك بنموذج الإجابة أسفل كل سؤال.${auto?'<br><strong style="color:var(--wrong);">تم تسليم الامتحان تلقائيًا لانتهاء الوقت</strong>':''}`;
  ['quiz-area','submit-box'].forEach(i=>document.getElementById(i).style.display='none');
  document.getElementById('timer-float').style.display='none';
  document.querySelector('.progress-wrap').style.display='none'; document.getElementById('progress-label').style.display='none';
  document.getElementById('results').style.display='block'; window.scrollTo({top:0,behavior:'auto'});
}

function buildWhatsAppSummaryText(){
  const d='----------------------', L=[];
  L.push('*تقرير '+EXAM_TITLE+'*','*Prepared by Eng.Marco Edwer*',d);
  L.push(`*الاسم:* ${studentName}`,`*التاريخ:* ${new Date().toLocaleDateString('ar-EG')}`,`*الوقت المستغرق:* ${examDurationText} من أصل 120:00`);
  L.push(`*الجزء الأول (موضوعي):* ${finalA} / ${finalAMax}`);
  L.push(wrongQuestionNumbers.length?`*الفقرات الخاطئة:* ${wrongQuestionNumbers.join('، ')}`:'*لا توجد أخطاء في الجزء الموضوعي*',d,'*إجابات الجزء المقالي (50 درجة — للتصحيح اليدوي):*');
  essayAnswersList.forEach(e=>{L.push(`${e.num} [${e.marks}]: ${e.q}`,`الإجابة: ${e.a}`,'. . .');});
  L.push(d,'تفاصيل كل الأسئلة ونموذج الإجابة مرفقة في ملف PDF.');
  return L.join('\n');
}

async function buildPdfBlob(){
  const source = document.getElementById('report-content');
  const clone = source.cloneNode(true);
  const wrapper = document.getElementById('pdf-report');
  wrapper.innerHTML = '';
  wrapper.appendChild(clone);

  const canvas = await html2canvas(wrapper, {scale:2, backgroundColor:'#ffffff', useCORS:true});
  const imgData = canvas.toDataURL('image/jpeg', 0.92);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWidth = 210;
  const pageHeight = 297;
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  wrapper.innerHTML = '';
  return pdf.output('blob');
}

document.getElementById('send-wa-btn').addEventListener('click', async function(){
  const statusEl = document.getElementById('send-status');
  const btn = this;
  btn.disabled = true;
  statusEl.textContent = '⏳ جاري تجهيز تقرير PDF...';

  try{
    const blob = await buildPdfBlob();
    const fileName = `تقرير_${studentName.replace(/\s+/g,'_')}.pdf`;
    const file = new File([blob], fileName, {type:'application/pdf'});
    const summaryText = buildWhatsAppSummaryText();

    if(navigator.canShare && navigator.canShare({files:[file]})){
      statusEl.textContent = '📤 اختر واتساب من قائمة المشاركة لإرسال التقرير...';
      await navigator.share({
        files:[file],
        title:'تقرير الامتحان',
        text: summaryText
      });
      statusEl.textContent = '✅ تم فتح قائمة المشاركة';
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const waText = summaryText + '\n\nتم تحميل ملف تقرير الامتحان (PDF) على جهازك، برجاء إرفاقه في هذه المحادثة.';
      const waUrl = `https://wa.me/${TEACHER_PHONE}?text=${encodeURIComponent(waText)}`;
      window.open(waUrl, '_blank');
      statusEl.textContent = 'تم تحميل ملف PDF وفتح واتساب — برجاء إرفاق الملف يدويًا في المحادثة.';
    }
  }catch(err){
    if(err && err.name === 'AbortError'){
      statusEl.textContent = 'تم إلغاء المشاركة.';
    } else {
      statusEl.textContent = 'حدث خطأ أثناء تجهيز التقرير، برجاء المحاولة مرة أخرى.';
    }
  } finally {
    btn.disabled = false;
  }
});


document.getElementById('submit-btn').addEventListener('click',()=>{
  const miss=[]; questions.forEach((_,i)=>{if(!isAnswered(i))miss.push(i);});
  if(miss.length){
    const w=document.getElementById('not-answered-warning');
    w.style.display='block'; w.style.color='var(--wrong)'; w.style.fontWeight='700'; w.style.marginBottom='10px';
    w.textContent=`لم تجب عن ${miss.length} سؤالًا. اضغط مرة أخرى للتسليم أو عُد لإكمالها.`;
    miss.forEach(i=>document.getElementById('card-'+i).classList.add('unanswered'));
    document.getElementById('card-'+miss[0]).scrollIntoView({behavior:'smooth',block:'center'});
    if(!window.__warned){window.__warned=true;return;}
  }
  finishExam(false);
});
document.getElementById('start-btn').addEventListener('click',()=>{
  const inp=document.getElementById('student-name'), name=inp.value.trim();
  if(!name){document.getElementById('name-warning').style.display='block';inp.focus();return;}
  studentName=name; initAudio();
  document.getElementById('start-screen').style.display='none';
  document.querySelector('.progress-wrap').style.display='block';
  document.getElementById('progress-label').style.display='block';
  document.getElementById('submit-box').style.display='block';
  document.getElementById('timer-float').style.display='block';
  renderAll(); startTimer(); window.scrollTo({top:0,behavior:'auto'});
});
</script>
