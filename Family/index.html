@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050c26; --dot: rgba(246, 177, 30, .10); --surface: #0e1948; --surface-2: #16277a;
    --fg: #f1f4ff; --muted: #b0bbe4; --line: #2a3b86; --navy-text: #bdd0ff;
    --btn-bg: #f6b11e; --btn-fg: #1b1200; --danger: #ff8f86; --focus: #ffd05e;
    --solid-shadow: #f6b11e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050c26; --dot: rgba(246, 177, 30, .10); --surface: #0e1948; --surface-2: #16277a;
  --fg: #f1f4ff; --muted: #b0bbe4; --line: #2a3b86; --navy-text: #bdd0ff;
  --btn-bg: #f6b11e; --btn-fg: #1b1200; --danger: #ff8f86; --focus: #ffd05e;
  --solid-shadow: #f6b11e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px);
  background-size: 24px 24px;
  color: var(--fg);
  font: 400 17px/1.6 var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 1060px; margin-inline: auto; padding-block: 20px 44px; display: grid; gap: 26px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; }
h2 { font-size: 2rem; line-height: 1.25; color: var(--navy-text); text-decoration: underline 6px var(--gold); text-underline-offset: 9px; text-decoration-skip-ink: none; }

/* header */
.top { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 24px; padding: 22px 28px; border-radius: 26px; color: #fff;
  background:
    radial-gradient(circle at var(--ray-x) var(--ray-y), rgba(246, 177, 30, .5) 0, rgba(246, 177, 30, 0) 40%),
    repeating-conic-gradient(from 0deg at var(--ray-x) var(--ray-y), rgba(255, 190, 50, .15) 0 5deg, rgba(246, 177, 30, 0) 5deg 15deg),
    linear-gradient(155deg, #0c47a3 0%, #05225a 100%); }
.logo { flex: none; width: 104px; aspect-ratio: 1; background: var(--logo) center / contain no-repeat; border-radius: 50%; box-shadow: 0 0 0 5px var(--gold), 0 0 0 11px rgba(246, 177, 30, .3), 0 14px 30px rgba(0, 0, 0, .4); }
.tt { position: relative; flex: 1 1 260px; display: grid; gap: 4px; min-width: 0; }
.eyebrow { font-weight: 800; color: var(--gold); letter-spacing: .02em; }
h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.12; color: #fff; }
.tsub { color: rgba(255, 255, 255, .85); font-weight: 500; }
.top .btn { position: relative; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 12px; border: 2px solid transparent; background: var(--btn-bg); color: var(--btn-fg); font: 800 1rem var(--font-body); text-decoration: none; cursor: pointer; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.mini { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--fg); font: 700 .9rem var(--font-body); cursor: pointer; }
.mini.danger { color: var(--danger); border-color: var(--danger); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 2px; min-width: 0; }
.stat .l { color: var(--muted); font-weight: 700; font-size: .95rem; }
.stat .n { font: 400 2.6rem/1.1 var(--font-display); color: var(--navy-text); overflow-wrap: anywhere; }
.stat .n.t { font-size: 1.7rem; line-height: 1.3; padding-block: 5px; }
.stat .s { color: var(--muted); font-size: .92rem; }
.stat.gold { background: var(--gold); border-color: var(--gold-deep); color: var(--gold-ink); }
.stat.gold .l, .stat.gold .s { color: var(--gold-ink); }
.stat.gold .n { color: var(--navy-deep); }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 18px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; font-size: .95rem; }
.search { flex: 1 1 280px; max-width: 460px; }
.inp { width: 100%; min-height: 48px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); font: 400 16px var(--font-body); }
.tabs { display: inline-flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--surface-2); }
.tab { min-height: 44px; padding: 0 24px; border-radius: 10px; border: 0; background: transparent; color: var(--fg); font: 800 1rem var(--font-body); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--btn-bg); color: var(--btn-fg); }

#view { display: grid; gap: 40px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 20px; }

/* bulletin */
.bulletin { display: grid; grid-template-columns: 220px minmax(0, 1fr); background: var(--surface); border: 3px solid var(--solid-shadow); border-radius: var(--radius); overflow: hidden; box-shadow: -9px 9px 0 var(--solid-shadow); }
.datebox { background: var(--gold); color: var(--gold-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 26px 12px; text-align: center; }
.datebox .dow { font-weight: 800; font-size: 1.2rem; }
.datebox .day { font: 400 5.8rem/.95 var(--font-display); color: var(--navy-deep); }
.datebox .mon { font-weight: 700; }
.datebox .time { margin-top: 10px; padding: 4px 18px; border-radius: 999px; background: var(--navy-deep); color: #fff; font-weight: 800; }
.bul-body { padding: 26px; display: grid; gap: 16px; align-content: center; min-width: 0; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px 26px; margin: 0; }
.roles dt { display: inline-block; padding: 2px 14px; border-radius: 999px; background: var(--surface-2); color: var(--navy-text); font-size: .92rem; font-weight: 800; }
.roles dd { margin: 8px 0 0; font-size: 1.55rem; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.pending { color: var(--muted); font-size: 1.15rem; font-weight: 500; }
.note { color: var(--muted); border-top: 2px dashed var(--line); padding-top: 12px; }
.bul-tools { display: flex; gap: 8px; flex-wrap: wrap; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.month { display: inline-block; margin: 26px 0 12px; padding: 3px 20px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font: 400 1.3rem var(--font-display); }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 16px; align-items: start; padding: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.d, .cnt { text-align: center; line-height: 1.15; background: var(--navy); color: #fff; border-radius: 12px; padding: 8px 4px 9px; }
.d b, .cnt b { display: block; font: 400 2.2rem/1.1 var(--font-display); color: var(--gold); }
.d span, .cnt span { display: block; font-size: .82rem; color: #d3e1ff; }
.rb { min-width: 0; align-self: center; }
.who { display: flex; flex-wrap: wrap; gap: 4px 24px; min-width: 0; }
.pair { font-weight: 800; font-size: 1.1rem; overflow-wrap: anywhere; }
.pair em { font-style: normal; color: var(--navy-text); background: var(--surface-2); border-radius: 999px; padding: 1px 10px; margin-inline-end: 8px; font-size: .85rem; font-weight: 700; }
.rnote { flex-basis: 100%; color: var(--muted); font-size: .95rem; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.empty { color: var(--muted); padding: 18px 0; }
.count { color: var(--muted); font-weight: 700; }
.hits { display: flex; flex-wrap: wrap; gap: 10px; }
.hit { background: var(--gold); color: var(--gold-ink); border-radius: 999px; padding: 6px 18px; font-weight: 700; }
.hit b { font-weight: 800; margin-inline-end: 6px; }
.more { margin-top: 16px; }

/* people */
.person { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.person summary { list-style: none; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; cursor: pointer; }
.person summary::-webkit-details-marker { display: none; }
.person[open] { border-color: var(--navy-text); }
.pname { font-weight: 800; font-size: 1.25rem; overflow-wrap: anywhere; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pill { background: var(--surface-2); color: var(--navy-text); border-radius: 999px; padding: 1px 12px; font-size: .88rem; font-weight: 700; }
.pmeta { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.pdates { list-style: none; margin: 0; padding: 4px 16px 16px; display: grid; gap: 8px; }
.pdates li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 14px; border-radius: 12px; background: var(--bg); }
.pd { font-weight: 800; }
.pw { color: var(--muted); font-size: .92rem; }

/* form */
.admin { background: var(--surface); border: 3px solid var(--gold); border-radius: var(--radius); padding: 24px; display: grid; gap: 16px; }
.admin h3 { font: 400 1.7rem var(--font-display); color: var(--navy-text); }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; }
.items { display: grid; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.msg { min-height: 1.5em; font-weight: 800; color: var(--navy-text); }
.msg.err { color: var(--danger); }
.foot { color: var(--muted); font-size: .92rem; border-top: 3px solid var(--gold); padding-top: 14px; }

@media (max-width: 720px) {
  :root { --ray-x: calc(100% - 64px); }
  .top { padding: 18px 16px; gap: 14px 16px; }
  .logo { width: 84px; }
  .top .btn { width: 100%; }
  .tabs { width: 100%; }
  .tab { flex: 1; padding: 0 8px; }
  .bulletin { grid-template-columns: 1fr; box-shadow: -6px 6px 0 var(--solid-shadow); }
  .datebox { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 16px; padding: 16px 12px; }
  .datebox .day { font-size: 3.6rem; }
  .datebox .time { margin-top: 0; }
  .bul-body { padding: 20px; }
  .roles dd { font-size: 1.4rem; }
  .row, .person summary { grid-template-columns: 58px minmax(0, 1fr); gap: 12px; }
  .irow { grid-template-columns: 1fr auto; }
  .irow .inp-name { grid-column: 1 / -1; grid-row: 2; }
  .wrap { gap: 22px; }
  #view { gap: 32px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 14px; }
  .stat.gold { grid-column: 1 / -1; }
  .stat .n { font-size: 2.2rem; }
  .stat .n.t { font-size: 1.3rem; }
  h2 { font-size: 1.7rem; }

      var c = e && e.code;
      var t = c === 'conflict' ? 'تم تعديل الصفحة من مكان آخر وتم تحميل أحدث نسخة. أعد المحاولة.'
        : (c === 'not_writer' || c === 'not_granted') ? 'ليس لديك صلاحية تعديل هذه الصفحة.'
        : 'تعذّر الحفظ. حاول مرة أخرى.';
      setMsg(t, true); if (btn) btn.disabled = false;
    }
  }
  function submitForm() {
    readDraft();
    var d = ui.draft;
    if (!d.date) return setMsg('اختر تاريخ الجمعة.', true);
    var items = d.items.filter(function (i) { return i.name; }).map(function (i) { return { role: i.role || 'خادم', name: i.name }; });
    if (!items.length) return setMsg('اكتب اسمًا واحدًا على الأقل.', true);
    var clash = state.meetings.some(function (m) { return m.date === d.date && m.id !== d.id; });
    if (clash) return setMsg('يوجد اجتماع مسجل بنفس التاريخ. عدّله من القائمة بدل إضافته مرة أخرى.', true);
    var rec = { id: d.id || uid(), date: d.date, items: items, note: d.note };
    var list = state.meetings.filter(function (m) { return m.id !== rec.id; });
    list.push(rec); list.sort(asc);
    persist(list);
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { readDraft(); ui.tab = t.dataset.tab; ui.shown = 12; render(); return; }
    var act = t.dataset.act, id = t.dataset.id;
    if (!act) return;
    if (act === 'more') { ui.shown += 12; refreshView(); }
    else if (act === 'add') openAdmin(newDraft(t.dataset.date));
    else if (act === 'edit') { var m = state.meetings.filter(function (x) { return x.id === id; })[0]; if (m) openAdmin(newDraft(null, m)); }
    else if (act === 'del') { ui.confirmDel = id; refreshView(); }
    else if (act === 'del-no') { ui.confirmDel = null; refreshView(); }
    else if (act === 'del-yes') { persist(state.meetings.filter(function (x) { return x.id !== id; })); }
    else if (act === 'close-admin') { ui.adminOpen = false; ui.draft = null; render(); }
    else if (act === 'add-item') { readDraft(); ui.draft.items.push({ role: '', name: '' }); render(); var rs = document.querySelectorAll('.irow [data-name]'); if (rs.length) rs[rs.length - 1].focus(); }
    else if (act === 'rm-item') { readDraft(); ui.draft.items.splice(Number(t.dataset.i), 1); if (!ui.draft.items.length) ui.draft.items.push({ role: '', name: '' }); render(); }
  });
  app.addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; ui.shown = 12; refreshView(); }
  });

  render();
})();
</script></body></html>
